name: Validate Hood Hero
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --timeout=90000
      - run: npm run build
        env:
          VITE_BASE_PATH: /Hood-Hero/
      - run: npm run test:e2e -- tests/illustrated.spec.ts tests/city-menu.spec.ts tests/encounters.spec.ts tests/employment.spec.ts --timeout=90000
        env:
          PLAYWRIGHT_BASE_PATH: /Hood-Hero/
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: playable-build
          path: dist/
